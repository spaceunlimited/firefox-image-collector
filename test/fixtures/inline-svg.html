<!doctype html><meta charset="utf-8"><title>Inline SVG · fixtures</title><style>
body{font:14px system-ui;margin:24px;max-width:900px}
figure{display:inline-block;margin:0 16px 24px 0;vertical-align:top}
figcaption{font-size:12px;color:#555;max-width:260px}
h2{margin-top:32px}
svg{border:1px dashed #ddd}
.icon{fill:rebeccapurple;stroke:#0e7490;stroke-width:2px}
.icon .accent{fill:#e08a1e}
.tinted{color:#be123c;background:#fef2f2;padding:8px;display:inline-block}
.css-sized{width:96px;height:48px}
</style>
<h1>Inline SVG</h1>
<p>Right-click each SVG: with site access, "Copy Image + Collect" appears only over SVGs. Paste into a text editor to see the markup.</p>

<figure>
  <svg width="96" height="96" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="4" fill="#4d7c0f"/>
    <circle cx="12" cy="12" r="6" fill="#fef9c3"/>
  </svg>
  <figcaption>Plain inline SVG with width/height and fill attributes</figcaption>
</figure>

<figure>
  <svg class="css-sized" viewBox="0 0 24 12">
    <rect x="1" y="1" width="22" height="10" rx="2" fill="#1d4ed8"/>
  </svg>
  <figcaption>No width/height attributes, sized by CSS only: capture gets 96 × 48 baked in</figcaption>
</figure>

<figure>
  <svg class="icon" width="96" height="96" viewBox="0 0 24 24">
    <path d="M4 4h16v16H4z"/>
    <circle class="accent" cx="12" cy="12" r="5"/>
  </svg>
  <figcaption>Styled by page CSS classes (purple square, teal stroke, orange circle): the capture must keep the colors</figcaption>
</figure>

<figure>
  <span class="tinted">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l10 20H2z"/></svg>
  </span>
  <figcaption>currentColor icon in a red-tinted container: capture stays red</figcaption>
</figure>

<h2>References elsewhere in the page</h2>
<svg style="display:none" aria-hidden="true">
  <symbol id="spr-star" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 5 2 8-6.5-4.5L5.5 22l2-8L2 9h7z"/></symbol>
</svg>
<svg style="display:none" aria-hidden="true">
  <defs><linearGradient id="grad-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/>
  </linearGradient></defs>
</svg>
<figure>
  <svg width="96" height="96" viewBox="0 0 24 24" fill="#eab308"><use href="#spr-star"/></svg>
  <figcaption>Sprite icon via &lt;use href="#spr-star"&gt;: the symbol must travel into the capture</figcaption>
</figure>
<figure>
  <svg width="96" height="96" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" fill="url(#grad-sky)"/></svg>
  <figcaption>Gradient defined in another SVG: the gradient must travel into the capture</figcaption>
</figure>

<h2>Link and large</h2>
<figure>
  <a href="https://example.com/">
    <svg width="96" height="48" viewBox="0 0 24 12"><rect x="1" y="1" width="22" height="10" fill="#0f766e"/><circle cx="6" cy="6" r="3" fill="#fff"/></svg>
  </a>
  <figcaption>SVG wrapped in a link (logo case): without site access the item needs page context, so this one needs site access</figcaption>
</figure>
<figure>
  <svg id="huge" width="128" height="128" viewBox="0 0 40 40"></svg>
  <figcaption>1200-element SVG: style inlining is skipped, capture still works</figcaption>
</figure>

<h2>object / embed</h2>
<figure>
  <object data="img/sized.svg" type="image/svg+xml" width="150" height="100"></object>
  <figcaption>&lt;object&gt; SVG document (same-origin): captured as the original file URL</figcaption>
</figure>
<figure>
  <embed src="img/unsized.svg" width="150" height="100">
  <figcaption>&lt;embed&gt; SVG document (same-origin)</figcaption>
</figure>
<figure>
  <object data="http://127.0.0.1:8000/img/sized.svg" type="image/svg+xml" width="150" height="100"></object>
  <figcaption>Cross-origin &lt;object&gt; (127.0.0.1): without site access expect the fetch to fail and the permission hint</figcaption>
</figure>

<h2>Control</h2>
<figure>
  <img src="img/sized.svg">
  <figcaption>Plain &lt;img&gt; SVG: only ONE "Copy Image + Collect" item may appear (the image one)</figcaption>
</figure>

<script>
  const huge = document.getElementById('huge');
  const NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 1200; i += 1) {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', String(i % 40));
    r.setAttribute('y', String(Math.floor(i / 40)));
    r.setAttribute('width', '1');
    r.setAttribute('height', '1');
    r.setAttribute('fill', `hsl(${(i * 7) % 360} 70% 50%)`);
    huge.appendChild(r);
  }
</script>
<script>
  if (location.protocol === 'file:') {
    const rel = location.pathname.split('/test/fixtures/')[1] || '';
    const url = 'http://localhost:8000/' + rel;
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="background:#dc2626;color:#fff;padding:12px 16px;font-weight:bold;border-radius:6px">' +
      'This page is open as a local file, so the tests give wrong results. ' +
      'Make sure <code>npm run fixtures</code> is running, then ' +
      '<a style="color:#fff;text-decoration:underline" href="' + url + '">open ' + url + '</a>.</p>');
  }
</script>
