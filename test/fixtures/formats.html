<h2>data: and blob:</h2>
<figure><img id="data-img"><figcaption>data: URL image, label "Embedded image/png"</figcaption></figure>
<figure><img id="blob-img"><figcaption>blob: URL image drawn by the page, label "Generated image/png"</figcaption></figure>

<h2>Duplicates</h2>
<figure><img src="img/photo.png#again"><figcaption>Same PNG URL with a #fragment: merges into the PNG card</figcaption></figure>
<figure><img src="img/photo-mirror.png"><figcaption>Same bytes, different URL: merges into the PNG card, details list both URLs</figcaption></figure>

<script>
  const c = document.createElement('canvas');
  c.width = 240; c.height = 150;
  const g = c.getContext('2d');
  const paint = (fill, text) => { g.fillStyle = fill; g.fillRect(0, 0, 240, 150); g.fillStyle = '#fff'; g.font = 'bold 20px sans-serif'; g.fillText(text, 20, 82); };
  paint('#be123c', 'data: image');
  document.getElementById('data-img').src = c.toDataURL('image/png');
  paint('#4d7c0f', 'blob: image');
  c.toBlob((b) => { document.getElementById('blob-img').src = URL.createObjectURL(b); }, 'image/png');
</script>
<script>
  if (location.protocol === 'file:') {
    const rel = location.pathname.split('/test/fixtures/')[1] || '';
    const url = 'http://localhost:8000/' + rel;
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="background:#dc2626;color:#fff;padding:12px 16px;font-weight:bold;border-radius:6px">' +
      'This page is open as a local file, so the tests give wrong results. ' +
      'Make sure <code>npm run fixtures</code> is running, then ' +
      '<a style="color:#fff;text-decoration:underline" href="' + url + '">open ' + url + '</a>.</p>');
  }
</script>
