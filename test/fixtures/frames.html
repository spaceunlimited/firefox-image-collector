<!doctype html><meta charset="utf-8"><title>Frames · fixtures</title><style>body{font:14px system-ui;margin:24px;max-width:900px}figure{display:inline-block;margin:0 16px 24px 0;vertical-align:top}figcaption{font-size:12px;color:#555;max-width:320px}img{max-width:320px;border:1px solid #ddd}h2{margin-top:32px}</style>
<h1>Frames and cross-origin</h1>
<p>Open as <code>http://localhost:8000/frames.html</code>.</p>
<h2>Same-origin iframe</h2>
<iframe src="frame-inner.html" width="460" height="320"></iframe>
<h2>Cross-origin iframe (127.0.0.1)</h2>
<iframe src="http://127.0.0.1:8000/frame-inner.html" width="460" height="320"></iframe>
<h2>Cross-origin image without CORS headers</h2>
<figure><img src="http://127.0.0.1:8000/img/cross-origin.jpg"><figcaption>Without "access to all sites": expect a saved card marked copy failed. With it: copies normally.</figcaption></figure>
<script>
  if (location.protocol === 'file:') {
    const rel = location.pathname.split('/test/fixtures/')[1] || '';
    const url = 'http://localhost:8000/' + rel;
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="background:#dc2626;color:#fff;padding:12px 16px;font-weight:bold;border-radius:6px">' +
      'This page is open as a local file, so the tests give wrong results. ' +
      'Make sure <code>npm run fixtures</code> is running, then ' +
      '<a style="color:#fff;text-decoration:underline" href="' + url + '">open ' + url + '</a>.</p>');
  }
</script>
