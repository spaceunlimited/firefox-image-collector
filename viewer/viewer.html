<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Image Collector</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; background: light-dark(#f0f0f4, #1c1b22); }
    main { display: grid; place-items: center; padding: 16px; }
    img { max-width: 100%; max-height: calc(100vh - 80px); background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
    footer { padding: 8px 16px; color: light-dark(#5b5b66, #a8a8b3); }
  </style>
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <main><img id="img" alt=""></main>
  <footer id="caption"></footer>
</body>
</html>
